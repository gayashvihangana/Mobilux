<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b30"/>
      <stop offset="1" stop-color="#0b0f1c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#halo)"/>
  <!-- Charging case, open lid -->
  <rect x="190" y="280" width="220" height="130" rx="34" fill="#1a2138" stroke="#3b82f6" stroke-width="7"/>
  <rect x="190" y="228" width="220" height="64" rx="30" fill="#202a48" stroke="#3b82f6" stroke-width="7"/>
  <rect x="272" y="252" width="56" height="12" rx="6" fill="#60a5fa" opacity="0.5"/>
  <circle cx="300" cy="352" r="7" fill="#3b82f6"/>
  <!-- Left bud -->
  <g transform="rotate(-14 245 175)">
    <circle cx="245" cy="150" r="30" fill="#232c4a" stroke="#60a5fa" stroke-width="6"/>
    <rect x="236" y="172" width="18" height="46" rx="9" fill="#232c4a" stroke="#60a5fa" stroke-width="6"/>
  </g>
  <!-- Right bud -->
  <g transform="rotate(14 355 175)">
    <circle cx="355" cy="150" r="30" fill="#232c4a" stroke="#60a5fa" stroke-width="6"/>
    <rect x="346" y="172" width="18" height="46" rx="9" fill="#232c4a" stroke="#60a5fa" stroke-width="6"/>
  </g>
  <!-- Sound waves -->
  <path d="M170 120 q -22 30 0 60" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M430 120 q 22 30 0 60" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <text x="300" y="540" text-anchor="middle" fill="#445070" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="8">MOBILUX</text>
</svg>
