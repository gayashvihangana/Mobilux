<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b30"/>
      <stop offset="1" stop-color="#0b0f1c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#halo)"/>
  <!-- Tempered glass sheet, tilted -->
  <g transform="rotate(-8 300 300)">
    <rect x="215" y="140" width="170" height="320" rx="24" fill="url(#sheen)" stroke="#60a5fa" stroke-width="6"/>
    <rect x="231" y="156" width="138" height="288" rx="14" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
    <!-- Light sweep -->
    <polygon points="245,140 300,140 235,460 200,440" fill="#e0f2fe" opacity="0.12"/>
  </g>
  <!-- Sparkles -->
  <g fill="#93c5fd">
    <path d="M430 170 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" opacity="0.9"/>
    <path d="M170 400 l4.5 12 12 4.5 -12 4.5 -4.5 12 -4.5 -12 -12 -4.5 12 -4.5 Z" opacity="0.7"/>
    <circle cx="455" cy="330" r="4" opacity="0.6"/>
  </g>
  <text x="300" y="540" text-anchor="middle" fill="#445070" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="8">MOBILUX</text>
</svg>
