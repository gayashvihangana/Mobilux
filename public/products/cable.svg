<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b30"/>
      <stop offset="1" stop-color="#0b0f1c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#halo)"/>
  <!-- Coiled cable -->
  <path d="M180 190 C 180 150, 260 150, 300 175 C 360 210, 420 190, 430 250 C 440 315, 340 300, 300 300 C 240 300, 160 300, 170 365 C 178 420, 260 430, 320 415"
        fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  <path d="M180 190 C 180 150, 260 150, 300 175 C 360 210, 420 190, 430 250 C 440 315, 340 300, 300 300 C 240 300, 160 300, 170 365 C 178 420, 260 430, 320 415"
        fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.7"/>
  <!-- Connector top -->
  <g transform="rotate(-40 180 190)">
    <rect x="158" y="132" width="44" height="64" rx="10" fill="#1a2138" stroke="#60a5fa" stroke-width="5"/>
    <rect x="170" y="108" width="20" height="28" rx="6" fill="#60a5fa"/>
  </g>
  <!-- Connector bottom -->
  <g transform="rotate(15 320 415)">
    <rect x="300" y="400" width="44" height="64" rx="10" fill="#1a2138" stroke="#60a5fa" stroke-width="5"/>
    <rect x="312" y="460" width="20" height="28" rx="6" fill="#60a5fa"/>
  </g>
  <text x="300" y="540" text-anchor="middle" fill="#445070" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="8">MOBILUX</text>
</svg>
