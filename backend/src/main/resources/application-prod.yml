spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

server:
  servlet:
    session:
      cookie:
        same-site: None
        secure: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-for-production}
