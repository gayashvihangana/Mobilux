spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mobilux}
    username: ${PGUSER:mobilux}
    password: ${PGPASSWORD:mobilux}
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never

security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-for-production}
