server:
  port: 8080
  servlet:
    session:
      cookie:
        name: MOBILUX_SESSION
        http-only: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mobilux
    username: mobilux
    password: mobilux
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 120m
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: always
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

security:
  jwt:
    secret: "change-this-secret-for-production"
    expiration-minutes: 120

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,http://localhost:3002,https://mobilux.vercel.app,https://*.vercel.app"
