<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New repair form on a phone</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1B57C4}a:hover{color:#123E8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; color: #0E1A2B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 56px; padding: 0 4px 0 16px; background: #FFFFFF; border-bottom: 1px solid #D9E1EC; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">New repair</h1>
    <a href="#" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #10294B">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <form style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 14px; font-weight: 600">Customer name</label>
      <input id="name" type="text" value="Nimal Perera" style="height: 48px; box-sizing: border-box; border: 1px solid #C3CEDD; border-radius: 10px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, system-ui, sans-serif; color: #0E1A2B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="phone" style="font-size: 14px; font-weight: 600">Phone number</label>
      <input id="phone" type="tel" value="077 123 4567" style="height: 48px; box-sizing: border-box; border: 2px solid #10294B; border-radius: 10px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, system-ui, sans-serif; color: #0E1A2B">
      <span style="font-size: 13px; color: #4E5D72">Returning customer: 2 earlier repairs</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="device" style="font-size: 14px; font-weight: 600">Device</label>
      <input id="device" type="text" placeholder="e.g. Samsung Galaxy A32" style="height: 48px; box-sizing: border-box; border: 1px solid #C3CEDD; border-radius: 10px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, system-ui, sans-serif; color: #0E1A2B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="problem" style="font-size: 14px; font-weight: 600">Problem</label>
      <input id="problem" type="text" placeholder="e.g. No power, cracked display" style="height: 48px; box-sizing: border-box; border: 1px solid #C3CEDD; border-radius: 10px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, system-ui, sans-serif; color: #0E1A2B">
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" style="height: 44px; padding: 0 12px; border: 1px solid #C3CEDD; border-radius: 22px; background: #FFFFFF; color: #0E1A2B; font: 500 14px Inter, system-ui, sans-serif">Display cracked</button>
        <button type="button" style="height: 44px; padding: 0 12px; border: 1px solid #C3CEDD; border-radius: 22px; background: #FFFFFF; color: #0E1A2B; font: 500 14px Inter, system-ui, sans-serif">No power</button>
        <button type="button" style="height: 44px; padding: 0 12px; border: 1px solid #C3CEDD; border-radius: 22px; background: #FFFFFF; color: #0E1A2B; font: 500 14px Inter, system-ui, sans-serif">Not charging</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="quote" style="font-size: 14px; font-weight: 600">Quoted price in LKR <span style="font-weight: 400; color: #4E5D72">(optional)</span></label>
      <input id="quote" type="text" inputmode="numeric" placeholder="Add after diagnosis" style="height: 48px; box-sizing: border-box; border: 1px solid #C3CEDD; border-radius: 10px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, system-ui, sans-serif; color: #0E1A2B">
    </div>
    <p style="margin: 0; font-size: 13px; color: #4E5D72">Saved as Received, today. <a href="#" style="font-weight: 600">Add a past repair instead</a></p>
  </form>

  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #D9E1EC">
    <a href="#" style="height: 52px; border-radius: 12px; background: #10294B; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Save and send tracking link</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
